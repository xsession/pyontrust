name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib pytest pytest-cov docopt

      - name: Run CSV Plotter tests
        run: |
          python -m pytest tests/csv_plotter_tests/ -v --tb=short

      - name: Run Power Framework tests
        run: |
          python -m pytest tests/power_framework_tests/ -v --tb=short -k "not ad3 and not dwf"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: |
          ruff check gui_app/csv_plotter/ pyontrust_packages/ --select E,W,F --ignore E501
