[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyontrust-gnuradio-module"
version = "0.1.0"
description = "Embeddable NiceGUI module to integrate GNU Radio (in-process and external runner)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pyontrust" }]
dependencies = [
  "nicegui>=1.4",
]

[project.optional-dependencies]
zmq = ["pyzmq>=25"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
