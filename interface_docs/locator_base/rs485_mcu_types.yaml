# ─────────────────────────────────────────────────────────────────
#  Locator Base — RS-485 Types  (rs485_mcu_types.yaml)
# ─────────────────────────────────────────────────────────────────

types:

  # ── Baud rate selection enum ───────────────────────────────
  baud_rate_ten:
    size: 16
    format: enum
    values:
      BAUD_1200:     0
      BAUD_2400:     1
      BAUD_4800:     2
      BAUD_9600:     3
      BAUD_19200:    4
      BAUD_38400:    5
      BAUD_57600:    6
      BAUD_115200:   7

  # ── Modbus exception codes ────────────────────────────────
  modbus_exception_ten:
    size: 8
    format: enum
    values:
      ILLEGAL_FUNCTION:        0x01
      ILLEGAL_DATA_ADDRESS:    0x02
      ILLEGAL_DATA_VALUE:      0x03
      SLAVE_DEVICE_FAILURE:    0x04
      ACKNOWLEDGE:             0x05
      SLAVE_DEVICE_BUSY:       0x06
