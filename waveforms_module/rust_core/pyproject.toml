[build-system]
requires = ["maturin>=1.6,<2"]
build-backend = "maturin"

[project]
name = "pyontrust-waveforms-core"
version = "0.1.0"
requires-python = ">=3.10"
description = "Rust DSP core for pyontrust-waveforms-module (PyO3 extension)"

[tool.maturin]
module-name = "pyontrust_waveforms_core"
features = ["pyo3/extension-module"]

[tool.maturin.platform]
linux = { manylinux = "auto" }
