[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyontrust-waveforms-module"
version = "0.1.0"
description = "Embeddable WaveForms-clone module (NiceGUI UI + HAL/MAL + Rust DSP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nicegui>=1.4.0",
  "numpy>=1.24",
  "pydantic>=2.5",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
dev = [
  "maturin>=1.6,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


