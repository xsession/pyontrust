# ─────────────────────────────────────────────────────────────────
#  Locator Base — CANopen Types  (canopen_mcu_types.yaml)
# ─────────────────────────────────────────────────────────────────

types:

  # ── LED control word ───────────────────────────────────────
  led_control_tun:
    size: 8
    format: union
    fields:
      all:
        size: 8
        format: uint
      bits: EXT__led_control_tst
    codegen:
      py:
        display: bits

  led_control_tst:
    size: 8
    format: bitfield
    fields:
      LED_STATUS:
        size: 1
        doc: >
          Status LED (PA2 / DOUT0). 1 = on.
      LED_USER:
        size: 1
        doc: >
          User LED (PA4 / DOUT1). 1 = on.
      LED_ERROR:
        size: 1
        doc: >
          Error indicator LED (PA9 / DOUT2). 1 = on.
      LED_COMM:
        size: 1
        doc: >
          Communication activity LED (PA25 / DOUT3). 1 = on.
      RESERVED:
        size: 4
        doc: >
          Reserved.

  # ── Button state word ──────────────────────────────────────
  button_state_tun:
    size: 8
    format: union
    fields:
      all:
        size: 8
        format: uint
      bits: EXT__button_state_tst
    codegen:
      py:
        display: bits

  button_state_tst:
    size: 8
    format: bitfield
    fields:
      BTN_USER:
        size: 1
        doc: >
          User button (PA18 / DIN3). 1 = pressed.
      RESERVED:
        size: 7
        doc: >
          Reserved.

  # ── Device status word ─────────────────────────────────────
  device_status_tun:
    size: 16
    format: union
    fields:
      all:
        size: 16
        format: uint
      bits: EXT__device_status_tst
    codegen:
      py:
        display: bits

  device_status_tst:
    size: 16
    format: bitfield
    fields:
      ACTIVE:
        size: 1
        doc: >
          Node is active and operational.
      ERROR:
        size: 1
        doc: >
          Error flag. Check error register for details.
      CAN_OK:
        size: 1
        doc: >
          CAN bus operational (no bus-off).
      TEMP_WARN:
        size: 1
        doc: >
          Board temperature exceeds warning threshold.
      CAL_VALID:
        size: 1
        doc: >
          Calibration data is valid and loaded.
      RESERVED:
        size: 11
        doc: >
          Reserved.
