# ─────────────────────────────────────────────────────────────────
#  Locator Base — Code Generation Batch Manifest  (mp.yaml)
#
#  Usage:  python interface_docs/generate.py interface_docs/mp.yaml
# ─────────────────────────────────────────────────────────────────

# ── CANopen ──────────────────────────────────────────────────

- source: locator_base/canopen_mcu.yaml
  output: generated/c/canopen_mcu_can_if.h
  format: c-objdict
  dependencies:
    - locator_base/canopen_mcu_types.yaml
  includes:
    - '<stdint.h>'
    - '"canopen_mcu_types.h"'

- source: locator_base/canopen_mcu_types.yaml
  output: generated/c/canopen_mcu_types.h
  format: c-typedefs
  includes:
    - '<stdint.h>'

- source: locator_base/canopen_mcu.yaml
  output: generated/py/canopen_driver.py
  format: python
  od_name: LocatorBase
  dependencies:
    - locator_base/canopen_mcu_types.yaml

- source: locator_base/canopen_mcu.yaml
  output: generated/html/canopen_interface.html
  format: html
  dependencies:
    - locator_base/canopen_mcu_types.yaml

