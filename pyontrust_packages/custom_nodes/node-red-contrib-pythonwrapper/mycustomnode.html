<script type="text/javascript">
    RED.nodes.registerType('mycustomnode', {
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: {value:""}
        },
        inputs:1,
        outputs:1,
        icon: "font-awesome/fa-cogs",
        label: function() {
            return this.name || "PythonWrapper";
        }
    });
</script>

<script type="text/x-red" data-template-name="mycustomnode">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/x-red" data-help-name="mycustomnode">
    <p>This node runs Python code and returns its output.</p>
</script>
