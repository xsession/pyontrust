[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyontrust"
version = "2026.3.0"
description = "Enterprise embedded test & measurement platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pyontrust Team"},
]
keywords = ["embedded", "testing", "iot", "power-measurement", "hil", "sdr", "csv-plotter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
]
dependencies = []  # Core has ZERO mandatory dependencies

[project.optional-dependencies]
gui = [
    "flask>=3.0",
    "flask-sock>=0.7",
]
mcp = [
    "mcp>=1.9.0",
]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.6",
]
analysis = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
]
aoi = [
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "numpy>=1.23",
    "harvesters>=1.4",
]
thermal = [
    "numpy>=1.23",
    "opencv-python>=4.8",
    "seekcamera-python>=1.1; sys_platform == 'linux'",
]
sdr = [
    "numpy>=1.23",
]
power = [
    "docopt>=0.6.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
all = [
    "pyontrust[gui,build,analysis,sdr,power,aoi,thermal,dev]",
]

[project.scripts]
pyontrust = "pyontrust.gateway.app:main"
pyontrust-mcp = "pyontrust.mcp_server:main"

[project.entry-points."pyontrust.instruments"]
simulated     = "pyontrust.instruments.simulated:create"
ad3_dwf       = "pyontrust.instruments.ad3_dwf:create"
ad3_cluster   = "pyontrust.instruments.ad3_cluster:create"
csv_file      = "pyontrust.instruments.csv_power_meter:create"
csv_process   = "pyontrust.instruments.csv_power_meter:create"
aoi_camera    = "pyontrust.instruments.aoi_camera:create"
seek_thermal  = "pyontrust.instruments.seek_thermal:create"

[project.entry-points."pyontrust.recorders"]
process       = "pyontrust.recorders.process:create"
hackrf_iq     = "pyontrust.recorders.hackrf_iq:create"
ffmpeg        = "pyontrust.recorders.ffmpeg_webcam:create"
pcan_can      = "pyontrust.recorders.pcan_can:create"
nrf52840      = "pyontrust.recorders.nrf52840_dongle:create"
aoi           = "pyontrust.recorders.aoi:create"
thermal       = "pyontrust.recorders.thermal:create"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyontrust.gateway.web" = ["**/*.html", "**/*.css", "**/*.js", "**/*.ico"]

# --- Testing ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -q --tb=short"
markers = [
    "slow: marks tests as slow (>5s)",
    "integration: needs external hardware or Docker",
    "ad3: needs Analog Discovery 3",
    "ppk2: needs Nordic PPK2",
    "jlink: needs SEGGER J-Link",
    "hackrf: needs HackRF One",
    "can: needs PEAK-CAN adapter",
    "aoi: needs industrial camera or AOI dependencies",
    "thermal: needs Seek Thermal camera or thermal dependencies",
    "e2e: browser-based end-to-end test",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

# --- Type checking ---------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# --- Linting ---------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B904"]

[tool.ruff.isort]
known-first-party = ["pyontrust", "pyontrust_packages", "gui_app"]

# --- Coverage --------------------------------------------------------------
[tool.coverage.run]
source = [
    "src/pyontrust",
    "pyontrust_packages",
    "gui_app/csv_plotter",
]
omit = ["tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
