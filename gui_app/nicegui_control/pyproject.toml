[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyontrust-nicegui-control"
version = "0.1.0"
description = "Pyontrust instrument control GUI (NiceGUI)"
requires-python = ">=3.10"
dependencies = [
  "nicegui>=1.4.0",
  "pywebview>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.briefcase]
project_name = "Pyontrust GUI"
bundle = "com.xsession.pyontrust"
version = "0.1.0"
url = "https://example.invalid"
license = "Proprietary"
author = "xsession"

[tool.briefcase.app.pyontrust_gui]
formal_name = "Pyontrust GUI"
description = "Instrument control and power test runner"
icon = "src/pyontrust_gui/resources/pyontrust_gui"
source_dir = "src"
sources = [
  "src/pyontrust_gui",
  "../../pyontrust_packages",
  "../../scripts",
]
entry_point = "pyontrust_gui.app:main"
requires = [
  "nicegui>=1.4.0",
  "pywebview>=5.0",
]

[tool.briefcase.app.pyontrust_gui.windows]
requires = []

[tool.briefcase.app.pyontrust_gui.linux]
requires = []
