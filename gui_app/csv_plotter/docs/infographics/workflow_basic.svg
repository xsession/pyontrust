<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .title{font:700 18px sans-serif;fill:#111}
      .label{font:14px sans-serif;fill:#111}
      .arrow{stroke:#111;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Basic Workflow</text>

  <rect x="60" y="90" width="260" height="90" rx="10" class="box"/>
  <text x="190" y="140" class="label" text-anchor="middle">1) Choose CSV File</text>

  <path class="arrow" d="M320 135 L380 135"/>

  <rect x="380" y="90" width="260" height="90" rx="10" class="box"/>
  <text x="510" y="140" class="label" text-anchor="middle">2) Select Signals</text>

  <path class="arrow" d="M640 135 L700 135"/>

  <rect x="700" y="90" width="200" height="90" rx="10" class="box"/>
  <text x="800" y="140" class="label" text-anchor="middle">3) Plot All</text>

  <path class="arrow" d="M800 180 L800 240"/>

  <rect x="560" y="240" width="340" height="90" rx="10" class="box"/>
  <text x="730" y="290" class="label" text-anchor="middle">Optional: Add overlay files</text>

  <path class="arrow" d="M730 330 L730 390"/>

  <rect x="60" y="390" width="840" height="90" rx="10" class="box"/>
  <text x="480" y="432" class="label" text-anchor="middle">Select a window (drag) → Table/Histogram/Checks operate on that window</text>
</svg>
