<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .title{font:700 18px sans-serif;fill:#111}
      .label{font:14px sans-serif;fill:#111}
      .muted{font:12px sans-serif;fill:#444}
      .arrow{stroke:#111;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Window-Based Analysis</text>

  <rect x="60" y="90" width="840" height="120" rx="10" class="box"/>
  <text x="80" y="132" class="label">Drag on main plot to select a window (lo..hi)</text>
  <text x="80" y="160" class="muted">Window affects stats and bottom panels</text>

  <path class="arrow" d="M480 210 L480 250"/>

  <rect x="60" y="250" width="260" height="220" rx="10" class="box"/>
  <text x="190" y="290" class="label" text-anchor="middle">Stats Table</text>
  <text x="190" y="320" class="muted" text-anchor="middle">Min/Max/Avg/…</text>
  <text x="190" y="342" class="muted" text-anchor="middle">Freq/Period</text>

  <rect x="350" y="250" width="260" height="220" rx="10" class="box"/>
  <text x="480" y="290" class="label" text-anchor="middle">Histogram</text>

  <rect x="640" y="250" width="260" height="220" rx="10" class="box"/>
  <text x="770" y="290" class="label" text-anchor="middle">Checks</text>
  <text x="770" y="320" class="muted" text-anchor="middle">Abs / Rel</text>

  <text x="60" y="505" class="muted">Press Home or Clear window to analyze ALL data.</text>
</svg>
