<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .title{font:700 18px sans-serif;fill:#111}
      .label{font:14px sans-serif;fill:#111}
      .muted{font:12px sans-serif;fill:#444}
      .arrow{stroke:#111;stroke-width:2;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Layout Persistence</text>

  <rect x="60" y="90" width="320" height="140" rx="10" class="box"/>
  <text x="220" y="130" class="label" text-anchor="middle">UI state</text>
  <text x="220" y="160" class="muted" text-anchor="middle">subplots, overlays, window</text>
  <text x="220" y="180" class="muted" text-anchor="middle">global + per-file timebase</text>

  <path class="arrow" d="M380 160 L440 160"/>

  <rect x="440" y="90" width="220" height="140" rx="10" class="box"/>
  <text x="550" y="140" class="label" text-anchor="middle">layout.json</text>
  <text x="550" y="168" class="muted" text-anchor="middle">saved / loaded</text>

  <path class="arrow" d="M660 160 L720 160"/>

  <rect x="720" y="90" width="180" height="140" rx="10" class="box"/>
  <text x="810" y="140" class="label" text-anchor="middle">Restore</text>
  <text x="810" y="168" class="muted" text-anchor="middle">apply on startup</text>

  <rect x="60" y="290" width="840" height="180" rx="10" class="box"/>
  <text x="80" y="330" class="label">What is persisted</text>
  <text x="80" y="360" class="muted">- x_window (analysis range) per subplot</text>
  <text x="80" y="382" class="muted">- per-file overlay enabled + shifts</text>
  <text x="80" y="404" class="muted">- global timebase + per-file timebase overrides</text>
</svg>
