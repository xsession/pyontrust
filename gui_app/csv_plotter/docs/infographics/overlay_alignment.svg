<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .title{font:700 18px sans-serif;fill:#111}
      .label{font:14px sans-serif;fill:#111}
      .muted{font:12px sans-serif;fill:#444}
      .arrow{stroke:#111;stroke-width:2;fill:none;marker-end:url(#m)}
      .line{stroke:#111;stroke-width:2;fill:none}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Overlay Alignment & Shifts</text>

  <rect x="24" y="64" width="912" height="452" rx="10" class="box"/>

  <text x="60" y="110" class="label">Aligned timestamps</text>
  <path class="line" d="M60 140 L420 140"/>
  <path class="line" d="M60 170 L420 170"/>
  <text x="440" y="146" class="muted">Overlay uses same x-origin</text>

  <text x="60" y="240" class="label">Independent</text>
  <path class="line" d="M60 270 L420 270"/>
  <path class="line" d="M120 300 L420 300"/>
  <text x="440" y="276" class="muted">Each file shifted so it starts at 0</text>

  <text x="60" y="380" class="label">X shift (sec)</text>
  <path class="line" d="M60 410 L420 410"/>
  <path class="arrow" d="M220 410 L320 410"/>
  <text x="440" y="416" class="muted">Shift overlay left/right in seconds</text>
</svg>
