[package]
name = "pyontrust_csv_plotter_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyontrust_csv_plotter_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py310"] }
thiserror = "1.0"
csv = "1.3"

[profile.release]
lto = true
codegen-units = 1
