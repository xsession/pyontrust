name: waveforms_module

on:
  workflow_dispatch:
  push:
    paths:
      - 'waveforms_module/**'
  pull_request:
    paths:
      - 'waveforms_module/**'

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        py: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install module
        run: |
          python -m pip install -U pip
          python -m pip install -e waveforms_module

      - name: Run tests
        run: |
          cd waveforms_module
          python -m unittest discover -s tests -p "test_*.py"

  rust_core_wheels:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        py: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install -U pip maturin

      - name: Build wheels
        run: |
          maturin build -m waveforms_module/rust_core/pyproject.toml --release --out dist

      - name: Smoke import
        run: |
          python -m pip install --find-links dist pyontrust-waveforms-core
          python -c "import pyontrust_waveforms_core; print('ok')"
