name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build binaries and package
        shell: bash
        run: |
          set -euo pipefail
          python tools/make_binary_release.py --version "${GITHUB_REF_NAME}" --clean

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/baram-${{ github.ref_name }}-*-binaries.zip
            dist/SHA256SUMS-binaries-*

  release:
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build source archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="baram-${VERSION}/" -o "baram-${VERSION}-source.zip" "${VERSION}"
          git archive --format=tar --prefix="baram-${VERSION}/" "${VERSION}" | gzip -9 > "baram-${VERSION}-source.tar.gz"

      - name: Gather artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -maxdepth 2 -print0 | xargs -0 -I{} cp "{}" .

          python - <<'PY'
          import hashlib
          import pathlib

          files = []
          for p in pathlib.Path('.').glob('baram-*'):
              if p.is_file():
                  files.append(p)
          for p in pathlib.Path('.').glob('SHA256SUMS-binaries-*'):
              if p.is_file():
                  files.append(p)

          lines = []
          for p in sorted(files, key=lambda x: x.name):
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f"{h}  {p.name}")
          pathlib.Path('SHA256SUMS').write_text("\n".join(lines) + "\n", encoding='utf-8')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            baram-*-binaries.zip
            baram-*-source.zip
            baram-*-source.tar.gz
            SHA256SUMS
            SHA256SUMS-binaries-*
          generate_release_notes: true
