<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
  <defs>
    <style>
      .title{font:700 18px system-ui,Segoe UI,Arial;fill:#111}
      .label{font:600 13px system-ui,Segoe UI,Arial;fill:#111}
      .text{font:400 12px system-ui,Segoe UI,Arial;fill:#111}
      .box{fill:#fff;stroke:#222;stroke-width:2;rx:12;ry:12}
      .arrow{stroke:#222;stroke-width:2;fill:none;marker-end:url(#m)}
      .muted{fill:#555}
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#222"/>
    </marker>
  </defs>

  <text x="24" y="34" class="title">Release pipeline (tag-triggered)</text>

  <rect x="40" y="90" width="190" height="90" class="box"/>
  <text x="60" y="122" class="label">Push tag</text>
  <text x="60" y="146" class="text muted">v1.2.3</text>

  <rect x="270" y="70" width="220" height="130" class="box"/>
  <text x="290" y="102" class="label">Build binaries</text>
  <text x="290" y="128" class="text">Linux / Windows / macOS</text>
  <text x="290" y="150" class="text muted">PyInstaller</text>

  <rect x="520" y="70" width="220" height="130" class="box"/>
  <text x="540" y="102" class="label">Build source archives</text>
  <text x="540" y="128" class="text muted">git archive</text>

  <rect x="770" y="90" width="180" height="90" class="box"/>
  <text x="790" y="122" class="label">Publish release</text>
  <text x="790" y="146" class="text muted">GitHub / GitLab</text>

  <path d="M230 135 L270 135" class="arrow"/>
  <path d="M490 135 L520 135" class="arrow"/>
  <path d="M740 135 L770 135" class="arrow"/>

  <text x="270" y="240" class="text muted">Artifacts: source + binaries + SHA256SUMS</text>
</svg>
