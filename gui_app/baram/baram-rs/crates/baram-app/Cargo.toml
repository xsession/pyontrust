[package]
name = "baram-app"
version.workspace = true
edition.workspace = true
description = "BARAM CFD Suite — unified desktop application"

[[bin]]
name = "baram"
path = "src/main.rs"

[dependencies]
baram-core     = { path = "../baram-core" }
baram-mesh     = { path = "../baram-mesh" }
baram-openfoam = { path = "../baram-openfoam" }
baram-renderer = { path = "../baram-renderer" }

# GUI — eframe bundles egui + wgpu + winit
eframe    = { workspace = true }
egui      = { workspace = true }

# GPU (shared with baram-renderer)
wgpu      = { workspace = true }
bytemuck  = { workspace = true }
glam      = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# File dialogs
rfd = { workspace = true }
