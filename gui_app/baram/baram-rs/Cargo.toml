[workspace]
resolver = "2"
members = [
    "crates/baram-core",
    "crates/baram-mesh",
    "crates/baram-openfoam",
    "crates/baram-server",
    "crates/baram-renderer",
    "crates/baram-web",
    "crates/baram-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nextfoam/baram"
description = "BARAM CFD Suite – Rust/WebAssembly rewrite"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web server
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }

# WebSocket
tokio-tungstenite = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# WebGPU
wgpu = "0.20"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.27", features = ["serde"] }

# Windowing / blocking executor
winit = "0.29"
pollster = "0.3"

# GUI framework (eframe bundles egui + wgpu + winit)
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.28"
egui-wgpu = "0.28"
rfd = "0.14"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console", "Window", "Document", "Element", "HtmlCanvasElement",
    "WebGl2RenderingContext", "GpuDevice", "GpuAdapter",
    "Performance", "Navigator", "Gpu",
] }

# Leptos
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }

# Mesh / geometry
nalgebra = { version = "0.32", features = ["serde-serialize"] }
nom = "7"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
rayon = "1"
crossbeam-channel = "0.5"
notify = "6"
tempfile = "3"
walkdir = "2"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"   # size-optimise for WASM
