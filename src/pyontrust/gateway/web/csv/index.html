<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Plotter</title>
  <link rel="stylesheet" href="/csv/static/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">pyontrust</p>
        <h1>CSV Plotter</h1>
      </div>
      <div class="topbar-actions">
        <button id="save-layout-btn" type="button">Save layout</button>
        <button id="load-layout-btn" type="button">Load layout</button>
        <button id="reload-btn" type="button">Reload</button>
      </div>
    </header>

    <section class="toolbar card">
      <label>
        <span>Signal file</span>
        <input id="file-path-input" type="text" placeholder="C:\\data\\capture.csv">
      </label>
      <button id="load-file-btn" type="button">Load file</button>
      <label>
        <span>Folder</span>
        <input id="folder-path-input" type="text" placeholder="C:\\data\\runs">
      </label>
      <button id="load-folder-btn" type="button">Load newest</button>
      <div class="status-pill" id="dataset-pill">No file loaded</div>
    </section>

    <main class="workspace-grid">
      <aside class="card browser-panel">
        <div class="section-head">
          <h2>Browser</h2>
          <button id="browse-up-btn" type="button">Up</button>
        </div>
        <div class="browser-path-row">
          <select id="roots-select"></select>
          <button id="open-root-btn" type="button">Open</button>
        </div>
        <div class="browser-path-row">
          <input id="browser-path-input" type="text" placeholder="Browse path">
          <button id="browse-path-btn" type="button">Go</button>
        </div>
        <div class="browser-columns">
          <div>
            <h3>Folders</h3>
            <div id="folders-list" class="browser-list"></div>
          </div>
          <div>
            <h3>Files</h3>
            <div id="files-list" class="browser-list"></div>
          </div>
        </div>
      </aside>

      <section class="main-panel">
        <div class="card subplot-strip">
          <div class="section-head">
            <h2>Subplots</h2>
            <div class="inline-actions">
              <button id="add-subplot-btn" type="button">Add subplot</button>
              <button id="delete-subplot-btn" type="button">Delete active</button>
            </div>
          </div>
          <div id="subplot-tabs" class="subplot-tabs"></div>
        </div>

        <div class="card canvas-panel">
          <div class="section-head">
            <h2 id="active-title">Plot</h2>
            <div class="inline-actions">
              <select id="export-data-format">
                <option value="csv">csv</option>
                <option value="txt">txt</option>
                <option value="json">json</option>
                <option value="jsonl">jsonl</option>
                <option value="parquet">parquet</option>
                <option value="xlsx">xlsx</option>
                <option value="npz">npz</option>
                <option value="mat">mat</option>
                <option value="tdms">tdms</option>
              </select>
              <button id="export-data-btn" type="button">Export data</button>
              <button id="export-current-btn" type="button">Open render</button>
              <button id="export-combined-btn" type="button">Export combined</button>
            </div>
          </div>
          <div class="canvas-frame">
            <img id="render-image" alt="Plot render">
            <div id="render-placeholder" class="empty-state">Load a signal file to render the active subplot.</div>
          </div>
          <div id="message-bar" class="message-bar"></div>
        </div>

        <div class="card details-panel">
          <div class="section-head">
            <h2>Details</h2>
          </div>
          <div id="details-content"></div>
        </div>
      </section>

      <aside class="card controls-panel">
        <div class="section-head">
          <h2>Controls</h2>
        </div>
        <div class="form-grid">
          <label>
            <span>Title</span>
            <input id="title-input" type="text">
          </label>
          <label>
            <span>Mode</span>
            <select id="mode-select"></select>
          </label>
          <label class="full-width">
            <span>Signals</span>
            <select id="signals-select" multiple size="10"></select>
          </label>
          <label>
            <span>X min</span>
            <input id="x-min-input" type="number" step="any">
          </label>
          <label>
            <span>X max</span>
            <input id="x-max-input" type="number" step="any">
          </label>
          <label>
            <span>Y min</span>
            <input id="y-min-input" type="number" step="any">
          </label>
          <label>
            <span>Y max</span>
            <input id="y-max-input" type="number" step="any">
          </label>
          <label>
            <span>X alignment</span>
            <select id="x-align-select">
              <option value="aligned">Aligned</option>
              <option value="independent">Independent</option>
            </select>
          </label>
          <label class="toggle-row">
            <span>Show triggers</span>
            <input id="show-triggers-input" type="checkbox">
          </label>
        </div>

        <section class="config-block">
          <div class="section-head small">
            <h3>Histogram / Spectrum</h3>
          </div>
          <div class="form-grid compact">
            <label>
              <span>Histogram bins</span>
              <input id="histogram-bins-input" type="number" min="1" max="512" step="1">
            </label>
            <label>
              <span>Spectrum baseline cutoff</span>
              <input id="spectrum-cutoff-input" type="number" step="any">
            </label>
          </div>
        </section>

        <section class="config-block">
          <div class="section-head small">
            <h3>Range checks</h3>
          </div>
          <div class="barrier-grid">
            <div>
              <h4>Absolute</h4>
              <div class="form-grid compact">
                <label class="toggle-row"><span>Enabled</span><input id="abs-enabled-input" type="checkbox"></label>
                <label><span>Target</span><input id="abs-target-input" type="number" step="any"></label>
                <label><span>Limit in</span><input id="abs-limit-in-input" type="number" step="any"></label>
                <label><span>Limit out</span><input id="abs-limit-out-input" type="number" step="any"></label>
                <label><span>Start idx</span><input id="abs-start-input" type="number" step="1"></label>
                <label><span>End idx</span><input id="abs-end-input" type="number" step="1"></label>
              </div>
            </div>
            <div>
              <h4>Relative</h4>
              <div class="form-grid compact">
                <label class="toggle-row"><span>Enabled</span><input id="rel-enabled-input" type="checkbox"></label>
                <label><span>Target</span><input id="rel-target-input" type="number" step="any"></label>
                <label><span>Limit in</span><input id="rel-limit-in-input" type="number" step="any"></label>
                <label><span>Limit out</span><input id="rel-limit-out-input" type="number" step="any"></label>
                <label><span>Start idx</span><input id="rel-start-input" type="number" step="1"></label>
                <label><span>End idx</span><input id="rel-end-input" type="number" step="1"></label>
              </div>
            </div>
          </div>
        </section>

        <section class="config-block">
          <div class="section-head small">
            <h3>Custom code</h3>
          </div>
          <textarea id="custom-code-input" rows="10" spellcheck="false" placeholder="def transform(x, signals, df):
    return {name: series.diff().fillna(0) for name, series in signals.items()}"></textarea>
        </section>

        <section class="config-block">
          <div class="section-head small">
            <h3>Detector map</h3>
          </div>
          <div class="form-grid compact">
            <label><span>Rows</span><input id="detector-rows-input" type="number" min="1" step="1"></label>
            <label><span>Cols</span><input id="detector-cols-input" type="number" min="1" step="1"></label>
            <label><span>Mapping</span><input id="detector-mapping-input" type="text"></label>
            <label><span>Reducer</span><input id="detector-reducer-input" type="text"></label>
            <label class="full-width"><span>Signal map</span><textarea id="detector-map-input" rows="4" spellcheck="false"></textarea></label>
          </div>
        </section>

        <section class="config-block">
          <div class="section-head small">
            <h3>Overlays</h3>
          </div>
          <div class="browser-path-row">
            <input id="overlay-path-input" type="text" placeholder="C:\\data\\overlay.csv">
            <button id="add-overlay-btn" type="button">Add</button>
          </div>
          <div id="overlay-list" class="overlay-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="/csv/static/app.js"></script>
</body>
</html>
