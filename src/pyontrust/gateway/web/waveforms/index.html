<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⌁ Waveforms — pyontrust</title>
<style>
:root {
  --bg: #1e1e2e; --bg2: #252538; --bg3: #2d2d44; --bg4: #353550;
  --fg: #cdd6f4; --fg-dim: #6c7086;
  --accent: #89b4fa; --green: #a6e3a1; --red: #f38ba8;
  --yellow: #f9e2af; --peach: #fab387; --mauve: #cba6f7;
  --teal: #94e2d5; --border: #45475a; --radius: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); overflow-x: hidden; }

.container { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
header { display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); margin-bottom: 16px; flex-wrap: wrap; }
header h1 { color: var(--accent); font-size: 22px; }
header .sub { color: var(--fg-dim); font-size: 12px; width: 100%; }
.status-pill { padding: 3px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: auto; white-space: nowrap; }
.status-pill.idle { background: rgba(108,112,134,.15); color: var(--fg-dim); }
.status-pill.running { background: rgba(249,226,175,.15); color: var(--yellow); }
.status-pill.done { background: rgba(166,227,161,.15); color: var(--green); }
.status-pill.error { background: rgba(243,139,168,.15); color: var(--red); }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card h3 { color: var(--mauve); font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

.form-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
.form-group { display: flex; flex-direction: column; gap: 3px; }
.form-group label { font-size: 11px; color: var(--fg-dim); font-weight: 600; }
.form-group input, .form-group select { background: var(--bg3); border: 1px solid var(--border); color: var(--fg); padding: 6px 10px; border-radius: 4px; font-size: 12px; font-family: monospace; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }

.btn { padding: 8px 20px; border: none; border-radius: var(--radius); font-weight: 600; font-size: 13px; cursor: pointer; transition: .15s; background: var(--bg4); color: var(--fg); }
.btn:hover { filter: brightness(1.15); }
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-danger { background: var(--red); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-bar { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 12px 0; }
.stat-box { background: var(--bg3); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat-box .val { font-size: 18px; font-weight: 700; color: var(--accent); font-family: monospace; word-break: break-all; }
.stat-box.ch0 .val { color: var(--green); }
.stat-box.ch1 .val { color: var(--yellow); }
.stat-box .lbl { font-size: 10px; color: var(--fg-dim); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

.plot-wrap { background: #11111b; border-radius: var(--radius); padding: 8px; overflow-x: auto; }
canvas.scope, canvas.spec { display: block; width: 100%; min-width: 640px; height: 320px; }

table.peaks { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
table.peaks th, table.peaks td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--border); font-family: monospace; }
table.peaks th { color: var(--fg-dim); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
table.peaks td.f { color: var(--teal); }

.msg { font-size: 12px; color: var(--fg-dim); min-height: 16px; margin-top: 8px; }
.msg.error { color: var(--red); }
.disabled-note { background: rgba(108,112,134,.12); border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; font-size: 12px; color: var(--fg-dim); margin-top: 10px; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⌁ Waveforms</h1>
    <span class="status-pill idle" id="status-pill">loading devices…</span>
    <div class="form-group" style="margin-left:auto; min-width:260px;">
      <label for="device-select">Device</label>
      <select id="device-select"></select>
    </div>
    <div class="sub" id="device-sub">Digilent WaveForms clone — oscilloscope, spectrum analyzer &amp; signal generator over libdwf</div>
  </header>

  <!-- ── Oscilloscope ─────────────────────────────────────────────── -->
  <section class="card" id="scope-card">
    <h3>Oscilloscope <span style="font-size:10px;color:var(--fg-dim);font-weight:400;" id="scope-meta"></span></h3>
    <div class="form-row">
      <div class="form-group"><label for="rate-hz">Sample rate</label>
        <select id="rate-hz">
          <option value="10000">10 kS/s</option>
          <option value="50000">50 kS/s</option>
          <option value="250000" selected>250 kS/s</option>
          <option value="1000000">1 MS/s</option>
          <option value="5000000">5 MS/s</option>
        </select></div>
      <div class="form-group"><label for="record-s">Record length (s)</label>
        <input id="record-s" type="number" step="0.01" min="0.001" max="60" value="0.04"></div>
      <div class="form-group"><label for="ch0-range">CH1 range (V)</label>
        <input id="ch0-range" type="number" step="0.5" min="-10" max="10" placeholder="auto"></div>
      <div class="form-group"><label for="ch1-range">CH2 range (V)</label>
        <input id="ch1-range" type="number" step="0.5" min="-10" max="10" placeholder="auto"></div>
      <div class="form-group"><label for="trig-level">Trigger level (V)</label>
        <input id="trig-level" type="number" step="0.05" value="0"></div>
    </div>
    <div class="btn-bar">
      <button class="btn btn-primary" id="run-btn">▶ Run</button>
      <button class="btn btn-danger" id="stop-btn" disabled>■ Stop</button>
      <label class="check"><input type="checkbox" id="continuous"> continuous (auto re-capture)</label>
      <span style="font-size:11px;color:var(--fg-dim);margin-left:auto;" id="capture-time"></span>
    </div>
    <div class="plot-wrap" style="margin-top:12px;"><canvas class="scope" id="scope-canvas" width="1280" height="320"></canvas></div>

    <div class="stats-grid" id="measurements">
      <div class="stat-box ch0"><div class="val" id="m-ch0-vpp">—</div><div class="lbl">CH1 V<sub>PP</sub></div></div>
      <div class="stat-box ch0"><div class="val" id="m-ch0-rms">—</div><div class="lbl">CH1 V<sub>RMS</sub></div></div>
      <div class="stat-box ch0"><div class="val" id="m-ch0-mean">—</div><div class="lbl">CH1 mean</div></div>
      <div class="stat-box ch0"><div class="val" id="m-ch0-freq">—</div><div class="lbl">CH1 freq</div></div>
      <div class="stat-box ch1"><div class="val" id="m-ch1-vpp">—</div><div class="lbl">CH2 V<sub>PP</sub></div></div>
      <div class="stat-box ch1"><div class="val" id="m-ch1-rms">—</div><div class="lbl">CH2 V<sub>RMS</sub></div></div>
      <div class="stat-box ch1"><div class="val" id="m-ch1-mean">—</div><div class="lbl">CH2 mean</div></div>
      <div class="stat-box ch1"><div class="val" id="m-ch1-freq">—</div><div class="lbl">CH2 freq</div></div>
    </div>
  </section>

  <!-- ── Spectrum analyzer ────────────────────────────────────────── -->
  <section class="card" id="spectrum-card">
    <h3>Spectrum Analyzer <span style="font-size:10px;color:var(--fg-dim);font-weight:400;" id="spec-meta"></span></h3>
    <div class="btn-bar" style="margin-top:0;margin-bottom:12px;">
      <label class="check"><input type="radio" name="spec-ch" value="0" checked> CH1</label>
      <label class="check"><input type="radio" name="spec-ch" value="1"> CH2</label>
      <button class="btn btn-primary" id="spec-btn">Analyze</button>
    </div>
    <div class="plot-wrap"><canvas class="spec" id="spec-canvas" width="1280" height="320"></canvas></div>
    <table class="peaks" id="peak-table" style="display:none;">
      <thead><tr><th>#</th><th>Frequency (Hz)</th><th>Amplitude (V)</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- ── Signal generator ─────────────────────────────────────────── -->
  <section class="card" id="gen-card">
    <h3>Signal Generator</h3>
    <div id="gen-body">
      <div class="form-row">
        <div class="form-group"><label for="gen-func">Waveform</label>
          <select id="gen-func">
            <option value="sine" selected>sine</option><option value="square">square</option>
            <option value="triangle">triangle</option><option value="ramp_up">ramp up</option>
            <option value="ramp_down">ramp down</option><option value="noise">noise</option>
            <option value="dc">DC</option>
          </select></div>
        <div class="form-group"><label for="gen-freq">Frequency (Hz)</label>
          <input id="gen-freq" type="number" step="1" min="0.001" max="5000000" value="1000"></div>
        <div class="form-group"><label for="gen-amp">Amplitude (V pk)</label>
          <input id="gen-amp" type="number" step="0.05" min="-5" max="5" value="1.41"></div>
        <div class="form-group"><label for="gen-offset">Offset (V)</label>
          <input id="gen-offset" type="number" step="0.05" min="-5" max="5" value="0"></div>
      </div>
      <div class="btn-bar">
        <button class="btn btn-primary" id="gen-apply">Apply</button>
        <button class="btn btn-danger" id="gen-stop">Stop output</button>
        <span style="font-size:11px;color:var(--fg-dim);margin-left:auto;" id="gen-state"></span>
      </div>
    </div>
    <div class="disabled-note" id="gen-disabled" style="display:none;"></div>
  </section>

  <p class="msg" id="page-msg"></p>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const CH_COLORS = ["#a6e3a1", "#f9e2af"];   // ch0 green, ch1 yellow — classic scope colors
let DEVICES = [];
let busy = false;

function deviceIndex() { return parseInt($("device-select").value || "-1", 10); }
function setPill(cls, text) { const p = $("status-pill"); p.className = "status-pill " + cls; p.textContent = text; }
function msg(text, isErr) { const m = $("page-msg"); m.textContent = text || ""; m.className = "msg" + (isErr ? " error" : ""); }

async function api(path, body) {
  const res = await fetch("/waveforms" + path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data; try { data = await res.json(); } catch (e) { data = { ok: false, error: "invalid JSON response" }; }
  if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

// ── Canvas helpers ────────────────────────────────────────────────────
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  const w = Math.max(rect.width, 640), h = 320;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawGrid(ctx, w, h) {
  ctx.fillStyle = "#11111b"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(69,71,90,.55)"; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) { const x = (w / 10) * i; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let i = 1; i < 8; i++) { const y = (h / 8) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}

function fmtHz(f) { if (f == null) return "—"; if (f >= 1e6) return (f/1e6).toFixed(2)+" MHz"; if (f >= 1e3) return (f/1e3).toFixed(2)+" kHz"; return f.toFixed(1)+" Hz"; }
function fmtV(v) { if (v == null) return "—"; const a = Math.abs(v); if (a >= 100) return v.toFixed(1)+" V"; if (a >= 1) return v.toFixed(3)+" V"; if (a >= 1e-3) return (v*1e3).toFixed(2)+" mV"; return (v*1e6).toFixed(1)+" µV"; }

function drawScope(channels, recordS) {
  const cv = $("scope-canvas");
  const { ctx, w, h } = setupCanvas(cv);
  drawGrid(ctx, w, h);

  // common vertical scale across enabled channels (like a real scope)
  let lo = Infinity, hi = -Infinity;
  for (const ch of channels) {
    if (!ch.data.length) continue;
    lo = Math.min(lo, ...chunked(ch.data, 256).map(a => Math.min(...a)));
    hi = Math.max(hi, ...chunked(ch.data, 256).map(a => Math.max(...a)));
  }
  if (!isFinite(lo) || !isFinite(hi)) { ctx.fillStyle = "#6c7086"; ctx.font = "14px monospace"; ctx.fillText("no data — press Run", w/2 - 50, h/2); return; }
  const pad = (hi - lo) * 0.1 || 0.01;
  lo -= pad; hi += pad;

  for (const ch of channels) {
    if (!ch.data.length) continue;
    ctx.strokeStyle = CH_COLORS[ch.channel % 2]; ctx.lineWidth = 1.6;
    ctx.beginPath();
    const n = ch.data.length;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * w;
      const y = h - ((ch.data[i] - lo) / (hi - lo)) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // axis labels
  ctx.fillStyle = "#6c7086"; ctx.font = "11px monospace";
  ctx.fillText(fmtV(hi), 4, 12); ctx.fillText(fmtV(lo), 4, h - 4);
  ctx.fillText("0 s", w - 34, h - 4); ctx.fillText(recordS.toFixed(3) + " s", w - 60, 12);
}

function chunked(arr, size) { const out = []; for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size)); return out; }

function drawSpectrum(freqs, mags, peaks) {
  const cv = $("spec-canvas");
  const { ctx, w, h } = setupCanvas(cv);
  drawGrid(ctx, w, h);
  if (!freqs.length) { ctx.fillStyle = "#6c7086"; ctx.font = "14px monospace"; ctx.fillText("no data — press Analyze", w/2 - 55, h/2); return; }

  const fMax = freqs[freqs.length - 1];
  let mMax = Math.max(...chunked(mags, 256).map(a => Math.max(...a))) || 1e-9;
  // log-ish scale: compress so small peaks stay visible
  const yOf = (m) => h - Math.pow(Math.max(0, m) / mMax, 0.4) * (h - 20);

  ctx.strokeStyle = "#89b4fa"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < freqs.length; i++) {
    const x = (freqs[i] / fMax) * w;
    if (i === 0) ctx.moveTo(x, yOf(mags[i])); else ctx.lineTo(x, yOf(mags[i]));
  }
  ctx.stroke();

  // peak markers
  peaks.forEach((p, i) => {
    const x = (p.freq_hz / fMax) * w;
    ctx.strokeStyle = "rgba(156,226,213,.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    ctx.fillStyle = "#94e2d5"; ctx.font = "10px monospace";
    ctx.fillText(fmtHz(p.freq_hz), Math.min(x + 3, w - 60), 12 + (i % 2) * 11);
  });

  ctx.fillStyle = "#6c7086"; ctx.font = "11px monospace";
  ctx.fillText("0 Hz", 4, h - 4); ctx.fillText(fmtHz(fMax), w - 50, h - 4);
}

// ── Scope actions ─────────────────────────────────────────────────────
async function doCapture() {
  if (busy) return; busy = true;
  setPill("running", "capturing…"); msg("");
  const chs = [0, 1];
  const rangeV = {};
  for (const [ch, id] of [[0, "ch0-range"], [1, "ch1-range"]]) {
    const v = parseFloat($(id).value); if (!isNaN(v)) rangeV[ch] = v;
  }
  try {
    const data = await api("/api/scope/capture", {
      device_index: deviceIndex(), channels: chs,
      rate_hz: parseFloat($("rate-hz").value), record_s: parseFloat($("record-s").value) || 0.04,
      range_v: rangeV, trigger_source: "none", trigger_level_v: parseFloat($("trig-level").value) || 0,
    });
    drawScope(data.channels, data.capture.record_s);
    for (const ch of data.channels) {
      const s = ch.stats || {};
      $("m-ch" + ch.channel + "-vpp").textContent = fmtV(s.vpp_v);
      $("m-ch" + ch.channel + "-rms").textContent = fmtV(s.rms_v);
      $("m-ch" + ch.channel + "-mean").textContent = fmtV(s.mean_v);
      $("m-ch" + ch.channel + "-freq").textContent = fmtHz(s.freq_hz);
    }
    $("scope-meta").textContent = data.capture.rate_hz.toLocaleString() + " S/s × " + data.capture.record_s + " s · " + (data.capture.samples_total/1000).toFixed(0) + " k samples";
    $("capture-time").textContent = "last capture: " + data.capture.elapsed_ms + " ms";
    setPill("done", "ready");
  } catch (e) {
    setPill("error", "error"); msg(e.message, true);
  } finally { busy = false; }
}

let contTimer = null;
function startContinuous() { stopContinuous(); doCapture(); contTimer = setInterval(() => { if (!busy) doCapture(); }, 900); }
function stopContinuous() { if (contTimer) clearInterval(contTimer); contTimer = null; $("continuous").checked = false; }

async function doSpectrum() {
  setPill("running", "spectrum…"); msg("");
  const ch = parseInt(document.querySelector('input[name="spec-ch"]:checked').value, 10);
  try {
    const data = await api("/api/scope/spectrum", {
      device_index: deviceIndex(), channel: ch,
      rate_hz: parseFloat($("rate-hz").value), record_s: parseFloat($("record-s").value) || 0.04,
    });
    drawSpectrum(data.freqs, data.magnitudes, data.peaks);
    $("spec-meta").textContent = "CH" + (ch + 1) + " · " + data.n_samples.toLocaleString() + " samples · fmax " + fmtHz(data.freqs[data.freqs.length - 1]);
    const tbody = document.querySelector("#peak-table tbody");
    tbody.innerHTML = "";
    data.peaks.forEach((p, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + (i+1) + "</td><td class='f'>" + fmtHz(p.freq_hz) + "</td><td>" + fmtV(p.amp_v) + "</td>";
      tbody.appendChild(tr);
    });
    $("peak-table").style.display = data.peaks.length ? "" : "none";
    setPill("done", "ready");
  } catch (e) { setPill("error", "error"); msg(e.message, true); }
}

// ── Generator ─────────────────────────────────────────────────────────
function gateGenerator(dev) {
  if (!dev || !dev.has_analog_out) {
    $("gen-body").style.display = "none";
    const note = $("gen-disabled");
    note.style.display = "";
    note.textContent = (dev ? dev.name : "No device") + " has no analog outputs — signal generation is not available on this hardware. Connect an Analog Discovery 2 to use the generator.";
  } else {
    $("gen-body").style.display = "";
    $("gen-disabled").style.display = "none";
  }
}

async function genCall(path, extra) {
  const body = Object.assign({ device_index: deviceIndex(), channel: 0 }, extra || {});
  try {
    const data = await api("/api/gen" + path, body);
    $("gen-state").textContent = data.started ? "output running (CH1)" : "configured — press Apply then start";
    return true;
  } catch (e) { msg(e.message, true); return false; }
}

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  try {
    const data = await api("/api/devices");
    DEVICES = data.devices || [];
    const sel = $("device-select");
    sel.innerHTML = "";
    if (!DEVICES.length) {
      sel.innerHTML = "<option value='-1'>no DWF devices found</option>";
      setPill("error", "no device"); msg("No Digilent WaveForms device detected. Connect an Analog Discovery 2/3 over USB and reload.", true);
      gateGenerator(null); return;
    }
    DEVICES.forEach((d, i) => {
      const o = document.createElement("option");
      o.value = String(d.index);
      o.textContent = d.name + " · SN " + (d.serial || "?") + " (" + d.analog_in_channels + " in / " + d.analog_out_channels + " out)" + (d.is_opened ? " [open]" : "");
      sel.appendChild(o);
    });
    const dev = DEVICES[0];
    $("device-sub").textContent = dev.name + " · serial " + dev.serial + " — oscilloscope, spectrum analyzer" + (dev.has_analog_out ? ", signal generator" : "") + " over libdwf";
    gateGenerator(dev);
    setPill("done", DEVICES.length + " device(s)");
    doCapture();   // first live capture on load
  } catch (e) {
    setPill("error", "error"); msg(e.message, true);
  }
}

$("run-btn").addEventListener("click", () => { startContinuous(); });
$("stop-btn").addEventListener("click", stopContinuous);
$("spec-btn").addEventListener("click", doSpectrum);
$("gen-apply").addEventListener("click", async () => {
  const ok = await genCall("/configure", {
    function: $("gen-func").value, freq_hz: parseFloat($("gen-freq").value) || 1000,
    amplitude_v: parseFloat($("gen-amp").value) || 0, offset_v: parseFloat($("gen-offset").value) || 0,
  });
  if (ok) await genCall("/start", {});
});
$("gen-stop").addEventListener("click", () => genCall("/stop", {}).then(ok => { if (ok) $("gen-state").textContent = "output stopped"; }));

init();
</script>
</body>
</html>
