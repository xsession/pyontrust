<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIL Dashboard</title>
  <link rel="stylesheet" href="/static/shell/shell.css">
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    .hil-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      height: calc(100vh - 16px);
    }
    .hil-panel { display: flex; flex-direction: column; overflow: hidden; }
    .hil-panel h3 {
      font-size: 13px; color: var(--accent); padding: 8px 12px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .hil-panel .panel-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
    #power-chart, #rf-chart { width: 100%; height: 100%; }
    .controls-bar {
      display: flex; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .controls-bar label { font-size: 12px; color: var(--fg-dim); }
    .controls-bar input { width: 300px; }
    .event-row { font-size: 12px; font-family: 'Consolas', monospace; padding: 2px 0; }
    .event-row .ts { color: var(--fg-dim); margin-right: 8px; }
    .step-bar { display: flex; gap: 2px; padding: 8px 0; }
    .step-item {
      flex: 1; height: 24px; border-radius: 3px; background: var(--bg4);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; transition: background 0.3s;
    }
    .step-item.active { background: var(--accent); color: var(--bg); }
    .step-item.done { background: var(--green); color: var(--bg); }
    .step-item.fail { background: var(--red); color: var(--bg); }
    .status-row {
      display: flex; gap: 16px; align-items: center;
      font-size: 13px; padding: 8px 0;
    }
  </style>
</head>
<body>

<div class="controls-bar">
  <label for="profile-input">Profile JSON:</label>
  <input type="text" id="profile-input" placeholder="profiles/sleep_current.json">
  <button class="btn btn-primary" id="btn-start">▶ Start</button>
  <button class="btn btn-danger" id="btn-stop" disabled>■ Stop</button>
  <span class="spacer"></span>
  <span id="run-state" class="badge badge-info">idle</span>
</div>

<div class="hil-grid">
  <!-- Power Trace -->
  <div class="card hil-panel">
    <h3>⚡ Power Trace (Real-time)</h3>
    <div class="panel-body"><div id="power-chart"></div></div>
  </div>

  <!-- CAN / Marker Log -->
  <div class="card hil-panel">
    <h3>📋 Event Log</h3>
    <div class="panel-body" id="event-log"></div>
  </div>

  <!-- RF Spectrum -->
  <div class="card hil-panel">
    <h3>📡 RF Spectrum</h3>
    <div class="panel-body"><div id="rf-chart"></div></div>
  </div>

  <!-- Step Progress & Instruments -->
  <div class="card hil-panel">
    <h3>🔧 Test Progress</h3>
    <div class="panel-body">
      <div class="status-row">
        <strong>Steps:</strong>
        <div id="step-bar" class="step-bar"></div>
      </div>
      <div class="status-row">
        <strong>Instruments:</strong>
        <span id="instrument-badges"></span>
      </div>
      <div style="margin-top: 16px">
        <h4 style="font-size: 12px; color: var(--fg-dim); margin-bottom: 8px;">Run History</h4>
        <div id="history-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const API = '/hil/api';
  const btnStart = document.getElementById('btn-start');
  const btnStop  = document.getElementById('btn-stop');
  const profileInput = document.getElementById('profile-input');
  const runState = document.getElementById('run-state');
  const eventLog = document.getElementById('event-log');

  // ── Plotly layouts ──────────────────────────────────────────
  const darkLayout = {
    paper_bgcolor: '#1e1e2e', plot_bgcolor: '#252538',
    font: { color: '#cdd6f4', size: 11 },
    margin: { t: 10, r: 10, b: 30, l: 50 },
    xaxis: { gridcolor: '#45475a' }, yaxis: { gridcolor: '#45475a' },
  };

  Plotly.newPlot('power-chart', [{ x: [], y: [], mode: 'lines', name: 'Current (A)',
    line: { color: '#89b4fa', width: 1.5 }}], { ...darkLayout, yaxis: { ...darkLayout.yaxis, title: 'A' }},
    { responsive: true });

  Plotly.newPlot('rf-chart', [{ x: [], y: [], mode: 'lines', name: 'Power (dBm)',
    line: { color: '#a6e3a1', width: 1.5 }}], { ...darkLayout, yaxis: { ...darkLayout.yaxis, title: 'dBm' }},
    { responsive: true });

  // ── Controls ────────────────────────────────────────────────
  btnStart.addEventListener('click', async () => {
    const profile = profileInput.value.trim();
    if (!profile) return alert('Enter a profile path');
    const res = await fetch(API + '/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ profile }),
    });
    const data = await res.json();
    if (data.error) alert(data.error);
  });

  btnStop.addEventListener('click', async () => {
    await fetch(API + '/stop', { method: 'POST' });
  });

  // ── Status polling ──────────────────────────────────────────
  async function pollStatus() {
    try {
      const res = await fetch(API + '/status');
      const data = await res.json();
      const state = data.state || 'idle';
      runState.textContent = state;
      runState.className = 'badge ' + (
        state === 'running'  ? 'badge-ok' :
        state === 'error'    ? 'badge-err' :
        state === 'stopping' ? 'badge-warn' : 'badge-info'
      );
      btnStart.disabled = state === 'running' || state === 'stopping';
      btnStop.disabled  = state !== 'running';
    } catch {}
  }

  // ── Event polling ───────────────────────────────────────────
  async function pollEvents() {
    try {
      for (const ch of ['marker', 'can', 'power']) {
        const res = await fetch(API + '/events/' + ch + '?n=50');
        const events = await res.json();
        if (ch === 'power' && events.length > 0) {
          const xs = events.map(e => e.t_s);
          const ys = events.map(e => e.current_a);
          Plotly.react('power-chart', [{ x: xs, y: ys, mode: 'lines',
            name: 'Current (A)', line: { color: '#89b4fa', width: 1.5 }}],
            { ...darkLayout, yaxis: { ...darkLayout.yaxis, title: 'A' }});
        }
        if (ch === 'marker' || ch === 'can') {
          const html = events.slice(-30).reverse().map(e =>
            `<div class="event-row"><span class="ts">${(e.t_s||0).toFixed(3)}s</span>${e.label || e.ch}: ${JSON.stringify(e)}</div>`
          ).join('');
          if (html) eventLog.innerHTML = html;
        }
      }
    } catch {}
  }

  // ── History ─────────────────────────────────────────────────
  async function pollHistory() {
    try {
      const res = await fetch(API + '/history?limit=10');
      const runs = await res.json();
      const list = document.getElementById('history-list');
      list.innerHTML = runs.map(r =>
        `<div class="event-row">${r.profile} — <span class="badge ${r.state==='finished'?'badge-ok':'badge-err'}">${r.state}</span></div>`
      ).join('') || '<span style="color:var(--fg-dim)">No runs yet</span>';
    } catch {}
  }

  pollStatus(); pollHistory();
  setInterval(pollStatus, 3000);
  setInterval(pollEvents, 1000);
  setInterval(pollHistory, 10000);
})();
</script>
</body>
</html>
