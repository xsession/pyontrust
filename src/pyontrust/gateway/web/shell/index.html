<!DOCTYPE html>
<html lang="en" class="shell-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e2e">
  <title>pyontrust — Hardware Diagnostic</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/shell/tokens.css">
  <link rel="stylesheet" href="/static/shell/components.css">
  <link rel="stylesheet" href="/static/shell/shell.css">
  <link rel="stylesheet" href="/static/shell/ui-foundation.css">
</head>
<body class="shell-body">
  <a class="skip-link" href="#tool-frame">Skip to active tool</a>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <a href="#diag" class="brand" aria-label="pyontrust home">
          <span class="brand-mark" aria-hidden="true">⚡</span>
          <span class="brand-copy"><strong>pyontrust</strong><small>Test platform</small></span>
        </a>
        <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">×</button>
      </div>

      <!-- Entries are rendered from pyontrust.gateway.tools (single source of truth). -->
      <nav class="tool-nav" aria-label="Engineering tools">
        {{NAV}}
      </nav>

      <div class="sidebar-footer">
        <div class="platform-status" id="platform-status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span><strong id="status-label">Checking bench</strong><small id="status-detail">Connecting to gateway…</small></span>
        </div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <section class="workspace" aria-label="Active tool workspace">
      <header class="workspace-header">
        <div class="workspace-title-row">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-controls="app-sidebar" aria-expanded="false" aria-label="Open navigation">☰</button>
          <div class="workspace-titles">
            <h1 id="workspace-title">{{DEFAULT_TITLE}}</h1>
            <p id="workspace-description">{{DEFAULT_DESCRIPTION}}</p>
          </div>
        </div>
        <div class="workspace-actions">
          <a class="session-chip" id="session-chip" href="#station" title="Operator and device under test — recorded with every action">👤 …</a>
          <button class="icon-button" id="reload-tool" type="button" aria-label="Reload active tool" title="Reload active tool">↻</button>
          <a class="icon-button" id="open-tool" href="{{DEFAULT_URL}}" target="_blank" rel="noopener" aria-label="Open active tool in a new tab" title="Open in a new tab">↗</a>
        </div>
      </header>

      <main class="workspace-content" id="main-content">
        <div class="frame-loading" id="frame-loading" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span><span>Loading {{DEFAULT_TITLE}}…</span>
        </div>
        <iframe id="tool-frame" src="{{DEFAULT_URL}}" title="{{DEFAULT_TITLE}}" loading="eager"></iframe>
      </main>
    </section>
  </div>

  <noscript><p class="noscript">JavaScript is required to navigate the pyontrust workspace. Individual tools remain available at their direct URLs.</p></noscript>
  <script src="/static/shell/ui-foundation.js"></script>
  <script src="/static/shell/shell.js"></script>
</body>
</html>
